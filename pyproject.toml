[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nbody"
version = "0.1.0"
description = "N-body simulation with Barnes-Hut algorithm and Leapfrog integration"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
    "pillow",
    "numba",
    "click",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
nbody = "nbody.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]